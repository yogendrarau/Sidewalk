name: SIDEWALK prototype checks

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: sidewalk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, and deterministic contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Use Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install exact dependencies
        run: npm ci

      - name: Type-check Base44 functions
        run: deno check base44/functions/*/entry.ts

      - name: Lint
        run: npm run lint

      - name: Type-check JavaScript contracts
        run: npm run typecheck

      - name: Run unit and contract tests
        run: npm run test:unit

      - name: Build production bundle
        run: npm run build

      - name: Verify local script-capable font assets
        run: test "$(find dist -type f -name '*.woff2' | wc -l)" -ge 4

  sample-mode-e2e:
    name: Seven-locale sample-mode smoke tests
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Exercise all seven offline sample journeys
        run: npm run test:e2e

      - name: Preserve browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
