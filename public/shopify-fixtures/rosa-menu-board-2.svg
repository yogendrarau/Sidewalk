<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Rosa's fictional menu board, page two</title>
  <desc id="desc">A second watermarked Spanish menu board with an overlapping item and one deliberately unclear price.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4e2138"/>
      <stop offset="1" stop-color="#26101d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="#eadbc9"/>
  <g transform="rotate(1.3 600 450)" filter="url(#shadow)">
    <rect x="90" y="70" width="1020" height="760" rx="32" fill="url(#background)" stroke="#bd7744" stroke-width="22"/>
    <rect x="122" y="102" width="956" height="696" rx="18" fill="none" stroke="#f4b86c" stroke-width="3" opacity=".65"/>
    <text x="600" y="190" text-anchor="middle" fill="#fff1df" font-family="Georgia, serif" font-size="74" font-weight="700">MÁS DEL MENÚ</text>
    <text x="600" y="238" text-anchor="middle" fill="#f1b468" font-family="Arial, sans-serif" font-size="26" letter-spacing="5">PÁGINA 2 · DEMOSTRACIÓN</text>
    <g fill="#fff8ed" font-family="Arial, sans-serif" font-size="50">
      <text x="190" y="350">Tamales</text><text x="1000" y="350" text-anchor="end">$4.00</text>
      <text x="190" y="455">Empanada de queso</text><text x="1000" y="455" text-anchor="end">$6.00</text>
      <text x="190" y="560">Elote preparado</text><text x="1000" y="560" text-anchor="end">$?.00</text>
    </g>
    <g stroke="#f4b86c" stroke-width="3" opacity=".55">
      <path d="M190 382H1000"/><path d="M190 487H1000"/><path d="M190 592H1000"/>
    </g>
    <text x="600" y="700" text-anchor="middle" fill="#dfa86b" font-family="Arial, sans-serif" font-size="24">Una cifra es borrosa a propósito para la revisión</text>
  </g>
  <g transform="rotate(-24 600 450)" opacity=".23">
    <rect x="-120" y="388" width="1440" height="124" fill="#ffd28b"/>
    <text x="600" y="470" text-anchor="middle" fill="#572d12" font-family="Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="8">FICTICIA · HACKATHON · NO REAL</text>
  </g>
</svg>
